# Peers allowed to assert the external request scheme. The list mirrors the
# trusted ranges of 05-real-ip.conf — keep both in sync when you override either
# file. Matching on $realip_remote_addr uses the actual peer, so a client cannot
# enter the list through X-Forwarded-For.
geo $realip_remote_addr $trusted_proxy {
    default        0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    fc00::/7       1;
}
