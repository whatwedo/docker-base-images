# Only a trusted proxy peer (see 06-trusted-proxy.conf) may declare the external
# request as HTTPS. X-Use-Https is the legacy whatwedo header.
map "$trusted_proxy:$http_x_use_https:$http_x_forwarded_proto" $external_https {
    default             off;
    "~*^1:on:"          on;
    "~*^1:[^:]*:https$" on;
}

map $external_https $external_scheme {
    default http;
    on      https;
}

map $external_https $external_port {
    default 80;
    on      443;
}
