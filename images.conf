# Every image in build order, with the parent it derives from, whether it has to
# carry a service health check, and the test suites that have to pass for it.
#
# image      parent      health  tests
base         -           no      goss
php          base        no      goss imagick-pdf
nodejs       base        no      goss
nginx        base        yes     goss http-security
nginx-php    nginx       yes     goss imagick-pdf http-security
symfony      nginx-php   yes     goss imagick-pdf http-security runtime
