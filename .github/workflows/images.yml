name: Images

# Scheduled workflows run on main; the full build pipeline lives on v3.0.
on:
  schedule:
    - cron: '17 5 * * 0'
      timezone: Europe/Zurich
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Build, test and publish v3.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run images.yml --repo "$GH_REPO" --ref v3.0
